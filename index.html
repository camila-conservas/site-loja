<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camila Conservas</title>
<style>
:root{--bg:#faf7f2;--fg:#2b2118;--card:#fff;--ac:#a63d2f;--mut:#7a6d62;--bd:#e5dccf;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#1c1814;--fg:#f3ece3;--card:#272119;--ac:#e0705f;--mut:#a89c90;--bd:#3a3128}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:90px}
header{padding:16px;font-size:20px;font-weight:700;border-bottom:1px solid var(--bd)}main{max-width:640px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.card img,.ph{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:10px;flex:none}.ph{background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:34px}.grow{flex:1}.mut{color:var(--mut);font-size:14px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;margin:2px 0}button.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px}
.q{display:flex;gap:8px;align-items:center}.q button{padding:8px 16px;font-size:18px;min-width:44px}.q b{min-width:22px;text-align:center}a{color:var(--ac)}
#bar button{padding:12px 20px;font-size:16px}
.nc{border:2px solid var(--ac);border-radius:12px;padding:14px;text-align:center;margin:14px 0;display:flex;flex-direction:column;gap:4px}.nc b{font-size:18px;color:var(--ac)}.nc span{font-size:14px}
.tabs{display:flex;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-bottom:4px}.tabs button{flex:1;margin:0}
.sr{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);max-width:616px;margin:12px auto 0;padding:0 14px;background:var(--card);border:1px solid var(--bd);border-radius:24px;color:var(--mut)}.sr input{border:0;background:transparent;margin:0;padding:12px 0;outline:0;color:var(--fg)}
.hero{position:relative;min-height:210px;display:flex;align-items:center;gap:14px;padding:18px 16px;color:#fff;background:linear-gradient(90deg,rgba(25,15,5,.85),rgba(25,15,5,.35)),var(--foto) center/cover;border-radius:0 0 28px 28px;overflow:hidden}
.hero .lg{width:104px;height:104px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:6px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.hero .ht{display:flex;flex-direction:column;gap:6px}.hero .ht b{font:700 34px/1.1 Georgia,serif;text-shadow:0 2px 8px rgba(0,0,0,.45)}.hero .ht span{font-size:17px;opacity:.95}
.hero .mp{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.92);color:#2b2118;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;text-decoration:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:12px 12px 0}.chips span{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:13px}
@media(min-width:700px){.hero{min-height:260px;justify-content:center}.hero .lg{width:140px;height:140px}.hero .ht b{font-size:52px}.hero .ht span{font-size:20px}}
.tt{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin:16px 0}.tt b{font-size:24px;text-align:right}
.ret{background:var(--ac);color:#fff;border-radius:12px;padding:16px;text-align:center;margin:12px 0;display:flex;flex-direction:column;gap:4px}.ret b{font-size:20px}.ret hr{width:60%;border:0;border-top:1px solid rgba(255,255,255,.4);margin:10px auto 6px}.ret .end{font-size:15px;line-height:1.5;letter-spacing:.2px}.ret a{color:#fff;font-size:13px;opacity:.9}
@media(max-width:400px){main{padding:8px}.card{padding:10px;gap:8px}.card img,.ph{width:80px;height:80px}}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
h3{margin:16px 0 4px}code{word-break:break-all;display:block;background:var(--card);padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:12px}
#tk{display:none}
@media print{body>*:not(#tk){display:none!important}body{padding:0!important;margin:0!important;background:#fff!important}#tk{display:block;width:55mm;margin:0;padding:0 0 1mm;font:10px monospace;color:#000;background:#fff}@page{margin:0;size:58mm auto}}

const tlv=(i,v)=>i+String(v.length).padStart(2,"0")+v;
function crc(s){let c=0xFFFF;for(const ch of s){c^=ch.charCodeAt(0)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function pix(v,tx){let p=tlv("00","01")+tlv("01","11")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",CFG.pixKey))+tlv("52","0000")+tlv("53","986")+tlv("54",v.toFixed(2))+tlv("58","BR")+tlv("59",asc(CFG.pixNome).slice(0,25))+tlv("60",asc(CFG.pixCidade).slice(0,15))+tlv("62",tlv("05",tx))+"6304";return p+crc(p)}

const clean=src=>new Promise(r=>{const i=new Image;i.onload=()=>{const w=i.width,h=i.height,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(i,0,0);const im=x.getImageData(0,0,w,h),d=im.data,dk=(k,t)=>d[k]<t&&d[k+1]<t&&d[k+2]<t,nb=(X,Y)=>[[X+1,Y],[X-1,Y],[X,Y+1],[X,Y-1]].filter(([a,e])=>a>=0&&e>=0&&a<w&&e<h).map(([a,e])=>e*w+a);
const edge=[];for(let X=0;X<w;X++){edge.push(X,(h-1)*w+X)}for(let Y=0;Y<h;Y++){edge.push(Y*w,Y*w+w-1)}
if(edge.filter(p=>dk(p*4,30)).length/edge.length<.5)return r(null);
const seen=new Uint8Array(w*h),st=[];edge.forEach(p=>{if(dk(p*4,14)&&!seen[p]){seen[p]=1;st.push(p)}});
while(st.length){const p=st.pop(),X=p%w;nb(X,(p-X)/w).forEach(q=>{if(!seen[q]&&dk(q*4,14)){seen[q]=1;st.push(q)}})}
const out=new Uint8Array(seen);for(let p=0;p<w*h;p++)if(!seen[p]){const X=p%w;if(nb(X,(p-X)/w).some(q=>seen[q])&&(d[p*4]+d[p*4+1]+d[p*4+2])/3<70)out[p]=1}
for(let p=0;p<w*h;p++)if(out[p]){d[p*4]=d[p*4+1]=d[p*4+2]=255}
x.putImageData(im,0,0);r(c.toDataURL("image/jpeg",.85))};i.src=src});
